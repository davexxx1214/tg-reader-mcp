# 中文关键词 → 美股 ticker 映射
# 用于将金十bot等TG频道的中文财经新闻自动关联到美股标的
#
# 结构:
#   sector_name:
#     tickers: [TICKER1, TICKER2, ...]
#     keywords: [关键词1, 关键词2, ...]
#
# 匹配逻辑: 消息文本中出现任一 keyword 则关联该 sector 下所有 tickers

# ── 大宗商品 ──

oil:
  tickers: [USO, XLE, OXY, COP, XOM, CVX]
  keywords:
    - 原油
    - 石油
    - 油价
    - 布伦特
    - WTI
    - OPEC
    - 霍尔木兹
    - 油轮
    - 炼油
    - 石油出口
    - 油田
    - 输油

